name: Nightly Distribution

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to build from"
        required: true
        type: string
      release_pr_number:
        description: "Release PR number"
        required: true
        type: string

env:
  CI_MATRIX_ROOM_IDS: "!VqxAjEKxUCeJcJggHX:matrix.org,!RuUVonfeJZzoTvHUzZ:parity.io"
  # use it to test CI
  #CI_MATRIX_ROOM_IDS: "!tdUsxxIjsKKXaZZEcU:novasama-tech.org"

jobs:
  build:
    uses: ./.github/workflows/_build_distribute.yml
    with:
      release_branch: ${{ inputs.release_branch }}
      release_pr_number: ${{ inputs.release_pr_number }}
      build_configuration: "Nightly"
      is_nightly: true
      distribute_to_external_group: true
      # use "Test external distribution" to test CI without publishing to the public group
      external_group_name: "Daily test builds"
      s3_static_subdir: "nightly"
    secrets: inherit

  auto_merge:
    name: Auto-merge nightly build PR
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.succeeded == 'true' }}
    steps:
      - name: Merge PR and delete branch
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = parseInt('${{ inputs.release_pr_number }}', 10);
            console.log(`Auto-merging nightly build PR #${prNumber}...`);
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'merge'
              });
              console.log(`PR #${prNumber} merged successfully`);

              const branch = '${{ inputs.release_branch }}';
              console.log(`Deleting release branch: ${branch}`);
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                console.log(`Deleted branch ${branch}`);
              } catch (deleteError) {
                if (deleteError.status === 422) {
                  console.log(`Branch ${branch} already deleted`);
                } else {
                  console.log(`Warning: failed to delete branch ${branch}: ${deleteError.message}`);
                }
              }
            } catch (error) {
              core.warning(`Failed to merge PR #${prNumber}: ${error.message}`);
            }

  send-release-notification:
    name: Send Release Notification
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.succeeded == 'true' }}
    steps:
      - name: Send nightly release notification
        uses: novasamatech/github-actions/send-release-notification@v5
        with:
          platform: iOS
          pr_list: ${{ needs.build.outputs.pr_list_markdown }}
          release_info: |
            Version: ${{ needs.build.outputs.marketing_version }}
            Build number: ${{ needs.build.outputs.build_number }}
          download_links_format: inline
          # Each secret holds one ready-to-render markdown link entry, e.g.
          # "[TestFlight](https://testflight.apple.com/join/<id>)". The label is part
          # of the secret so that access hints stay out of the public repo.
          download_links: |
            ${{ secrets.TESTFLIGHT_DISTRIBUTION_LINK }}
            ${{ secrets.WEB_PAGE_DISTRIBUTION_LINK }}
          bot_url: ${{ secrets.NOTIFICATION_BOT_URL }}
          bot_api_token: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
          matrix_room_ids: ${{ env.CI_MATRIX_ROOM_IDS }}
